<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">

    <header class="sticky top-0 z-50 bg-gray-900 bg-opacity-50 backdrop-filter backdrop-blur-lg border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold">WeatherApp</h1>
            <div class="relative w-1/2">
                <input type="text" id="search-input" placeholder="Rechercher une ville..." class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div id="search-suggestions" class="absolute top-full left-0 w-full bg-gray-800 border border-gray-700 rounded-b-lg mt-1 hidden"></div>
            </div>
            <div class="flex items-center">
                <div id="favorites-button" class="mr-4 cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </div>
                <div class="flex items-center">
                    <span>°C</span>
                    <label class="switch mx-2">
                        <input type="checkbox" id="temp-unit-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span>°F</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">

        <div id="welcome-screen" class="text-center">
            <h2 class="text-3xl font-bold mb-4">Bienvenue sur WeatherApp</h2>
            <p class="text-lg mb-8">Recherchez une ville pour commencer ou choisissez parmi ces suggestions :</p>
            <div id="suggested-cities" class="flex justify-center space-x-4"></div>
        </div>

        <div id="weather-content" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="md:col-span-2">
                    <div id="current-weather" class="card"></div>
                    <div id="hourly-forecast" class="card mt-8"></div>
                    <div id="daily-forecast" class="card mt-8"></div>
                </div>
                <div id="favorites-sidebar" class="card">
                    <h3 class="text-xl font-bold mb-4">Favoris</h3>
                    <div id="favorites-list"></div>
                </div>
            </div>
        </div>

        <div id="error-screen" class="hidden text-center">
            <h2 class="text-3xl font-bold text-red-500 mb-4">Erreur</h2>
            <p class="text-lg">Impossible de charger les données météo. Veuillez réessayer.</p>
        </div>

    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center">
        <div id="modal-content" class="card w-full max-w-md"></div>
    </div>
    
    <div id="toast" class="fixed bottom-5 right-5 bg-blue-500 text-white py-2 px-4 rounded-lg shadow-lg hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
